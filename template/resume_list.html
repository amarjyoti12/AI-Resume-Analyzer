
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Resumes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-primary mb-4">Uploaded Resumes</h2>

    <table class="table table-bordered table-striped bg-white">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Resume File</th>
                <th>Upload Date</th>
            </tr>
        </thead>

        <tbody>
            {% for resume in resumes %}
            <tr>
                <td>{{ resume.name }}</td>
                <td>{{ resume.email }}</td>
                
            <td>
                <a href="{{ resume.resume_file.url }}" target="_blank"
                class="btn btn-sm btn-secondary">
                    View Resume
                </a>

                <a href="{% url 'analyze_resume' resume.id %}"
                class="btn btn-sm btn-primary">
                    Analyze Resume
                </a>
            </td>

                <td>{{ resume.uploaded_at|date:"d M Y, h:i A" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">
                    No resumes uploaded yet.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'home' %}" class="btn btn-primary">Upload Another Resume</a>
</div>

</body>
</html>
